---
version: "2.0"

services:
  softether:
    image: siomiz/softethervpn:latest
    expose:
      - port: 443
        as: 443
        to:
          - global: true
      - port: 992
        as: 992
        to:
          - global: true
      - port: 1194
        as: 1194
        proto: udp
        to:
          - global: true
      - port: 5555
        as: 5555
        to:
          - service: healthcheck
    env:
      - PSK=your_preshared_key_here
      - SPW=your_server_password_here

  v2ray:
    image: v2fly/v2fly-core:latest
    expose:
      - port: 1080
        as: 1080
        to:
          - service: healthcheck

  healthcheck:
   image: <your-actual-registry>/akash-vpn-healthcheck:<version>
    expose:
      - port: 3000
        as: 80
        to:
          - global: true
    env:
      - PORT=3000
      - HEALTH_CHECK_TIMEOUT=5000

profiles:
  compute:
    softether:
      resources:
        cpu:
          units: 1.0
        memory:
          size: 512Mi
        storage:
          size: 512Mi
    v2ray:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 256Mi
        storage:
          size: 256Mi
    healthcheck:
      resources:
        cpu:
          units: 0.25
        memory:
          size: 128Mi
        storage:
          size: 128Mi

  placement:
    dcloud:
      pricing:
        softether:
          denom: uakt
          amount: 1000
        v2ray:
          denom: uakt
          amount: 500
        healthcheck:
          denom: uakt
          amount: 250

deployment:
  softether:
    dcloud:
      profile: softether
      count: 1
  v2ray:
    dcloud:
      profile: v2ray
      count: 1
  healthcheck:
    dcloud:
      profile: healthcheck
      count: 1